[project]
name = "fantasy-api"
version = "0.1.0"
description = "FastAPI backend that aggregates fantasy football data from ESPN, Sleeper, Fleaflicker, DraftKings and Underdog."
readme = "README.md"
authors = [
    { name = "bgriffin", email = "bgriffin2365@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.146.0",
    "pydantic-settings>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
